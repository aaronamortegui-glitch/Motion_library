<style>
@font-face{font-family:"Inter Tight";src:url("../assets/fonts/InterTight[wght].ttf") format("truetype");font-weight:100 900}

:root{
  --pine:#0A211F; --leaf:#2A4E45; --cloud:#F7F9F2; --spark:#D8FF85; --mint:#8DFDBA;
  --stone:#E6D3B0; --sky:#A1D4FF; --sea:#19546E; --earth:#292423; --peach:#FF9595; --lav:#FFAFED;
  --sans:"Inter Tight","Helvetica Neue",Arial,sans-serif; --serif:"Instrument Serif","Times New Roman",Georgia,serif;
  --land:cubic-bezier(.12,.9,.28,1); --pop:cubic-bezier(.34,1.45,.64,1); --settle:cubic-bezier(.3,0,.1,1);
  --whip:cubic-bezier(.75,0,.05,1); --surge:cubic-bezier(.7,0,.3,1); --coast:cubic-bezier(.18,.28,0,.9);
  --glide:300ms; --arrive:467ms; --sweep:700ms; --stage:1100ms;
  --gut:max(16px, env(safe-area-inset-left, 0px)); --gutR:max(16px, env(safe-area-inset-right, 0px));
  --s:calc(min(100vw, var(--vh,1vh) * 177.78) / 1920); --ground:var(--pine); color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--pine)}
@media (min-width:900px) and (min-height:500px){html{scroll-snap-type:y mandatory}}
body{margin:0;background:var(--pine);color:var(--cloud);font-family:var(--sans);font-weight:500;-webkit-font-smoothing:antialiased;overflow-x:hidden}
::selection{background:var(--spark);color:var(--pine)}

button{font:inherit;color:inherit}

/* slides, grounds and the 16:9 stage (one Figma pixel = --s) */
.slide{position:relative;height:100vh;height:calc(var(--vh,1vh) * 100);scroll-snap-align:start;overflow:hidden}
.stage{position:absolute;left:50%;top:50%;width:calc(1920 * var(--s));height:calc(1080 * var(--s));translate:-50% -50%;z-index:3}
.abs{position:absolute;left:calc(var(--x) * var(--s));top:calc(var(--y) * var(--s));width:calc(var(--w) * var(--s))}
.g-cloud{background:var(--cloud);color:var(--pine);--accent:var(--pine);--rule:var(--pine);--card:#ECEFE6}
.g-stone{background:var(--stone);color:var(--pine);--accent:var(--pine);--rule:var(--pine);--card:#DCC8A3}
.g-mint{background:var(--mint);color:var(--pine);--accent:var(--pine);--rule:var(--pine)}
.g-pine{background:var(--pine);color:var(--cloud);--accent:var(--spark);--rule:var(--cloud);--card:#0E2B28}
.g-sea{background:var(--sea);color:var(--cloud);--accent:var(--spark);--rule:var(--cloud)}
.g-leaf{background:var(--leaf);color:var(--cloud);--accent:var(--mint);--rule:var(--cloud)}
.g-earth{background:var(--earth);color:var(--cloud);--accent:var(--peach);--rule:var(--cloud)}
.g-pine{--gc:10,33,31} .g-earth{--gc:41,36,35} .g-sea{--gc:25,84,110} .g-leaf{--gc:42,78,69}
.bg{position:absolute;inset:0;z-index:1;overflow:hidden}

.scrim{position:absolute;inset:0;z-index:2;pointer-events:none}
.band{position:absolute;left:0;right:0;z-index:2;pointer-events:none;height:calc(150 * var(--s))}
.band.top{top:0;background:linear-gradient(rgba(var(--gc),.92),rgba(var(--gc),0))}
.band.bot{bottom:0;background:linear-gradient(rgba(var(--gc),0),rgba(var(--gc),.85))}

/* chrome: the numbered menu, the mark, the curve readout, the page number, the dots and the progress bar */
.chrome,.foot{position:fixed;left:0;right:0;z-index:20;pointer-events:none;color:var(--chrome,var(--pine));transition:color var(--sweep) var(--settle)}
.chrome{top:0}.foot{bottom:0}
.chrome .row,.foot .row{width:calc(1920 * var(--s));margin-inline:auto;padding-inline:max(var(--gut), calc(50 * var(--s)));display:flex;gap:16px}
.chrome .row{padding-top:calc(46 * var(--s));align-items:flex-start}
.foot .row{padding-bottom:calc(30 * var(--s));align-items:center;font-size:max(.72rem, calc(21 * var(--s)))}
.navlist{display:grid;grid-template-columns:repeat(9, calc(166 * var(--s)));list-style:none;padding:0;pointer-events:auto;transition:opacity var(--arrive) var(--settle),transform var(--arrive) var(--land)}
.navlist a{color:inherit;text-decoration:none;font-size:max(.72rem, calc(21 * var(--s)));line-height:1;opacity:.72;position:relative;padding-bottom:6px;display:inline-block;transition:opacity var(--glide) var(--settle)}
.navlist a::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform var(--arrive) var(--land)}
.navlist a:hover,.navlist a.on{opacity:1;font-weight:600}
.navlist a.on::after{transform:scaleX(1)}
.brandmark{margin-left:auto;display:flex;align-items:center;gap:10px;font-weight:600;font-size:max(.8rem, calc(24 * var(--s)));pointer-events:auto;color:inherit;text-decoration:none;transition:opacity var(--arrive) var(--settle),transform var(--arrive) var(--land)}
.brandmark svg{width:max(20px, calc(30 * var(--s)));height:auto}
.brandmark svg path{fill:var(--logo,currentColor);transition:fill var(--sweep) var(--settle)}
.chrome[data-hide="1"] .navlist,.chrome[data-hide="1"] .brandmark{opacity:0;transform:translateY(-8px);visibility:hidden;transition:opacity var(--arrive) var(--settle),transform var(--arrive) var(--land),visibility 0s linear var(--arrive)}
.curve{display:flex;align-items:center;gap:.6em;opacity:.75;white-space:nowrap}
.curve svg{width:2.2em;height:1.3em;overflow:visible}
.curve svg path{fill:none;stroke:currentColor;stroke-width:1.6}
.curve svg circle{fill:currentColor}
.pageno{margin-left:auto;font-variant-numeric:tabular-nums}
.progress{position:fixed;left:0;top:0;height:3px;width:100%;transform-origin:left;transform:scaleX(0);background:var(--bar,var(--spark));z-index:31;transition:background var(--sweep) var(--settle)}
.dots{position:fixed;right:calc(var(--gutR) - 4px);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:9px;z-index:20;color:var(--chrome,var(--pine))}
.dots button{width:7px;height:7px;border-radius:999px;border:0;padding:0;background:currentColor;opacity:.3;cursor:pointer;transition:height var(--arrive) var(--pop),opacity var(--glide)}
.dots button.on{height:24px;opacity:1}
:focus-visible{outline:2px solid currentColor;outline-offset:4px;border-radius:4px}

/* type, in Figma pixels */
.serif{font-family:var(--serif);font-weight:400}.it{font-style:italic}.semi{font-weight:600}
.h80{font-size:calc(80 * var(--s));line-height:1;letter-spacing:-.02em}
.h96{font-size:calc(96 * var(--s));line-height:1;letter-spacing:-.02em;font-weight:600}
.h160{font-family:var(--serif);font-weight:400;font-size:calc(160 * var(--s));line-height:.95;letter-spacing:-.01em}
.t48{font-size:calc(48 * var(--s));line-height:1.15}.t37{font-size:calc(37 * var(--s));line-height:1.15}
.t32{font-size:calc(32 * var(--s));line-height:1.18}.t27{font-size:calc(27 * var(--s));line-height:1.2}
.t24{font-size:calc(24 * var(--s));line-height:1.2}.t21{font-size:calc(21 * var(--s));line-height:1.2}

.wrap{text-wrap:pretty}
.num{font-family:var(--serif);font-style:italic;font-size:calc(88 * var(--s));line-height:1;color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}

/* reveal system: words rise in their own mask, characters tumble in, blocks rise, fade, pop and wipe */
.w{display:inline-block;overflow:hidden;vertical-align:top;padding:.1em .16em .2em;margin:-.1em -.16em -.2em}
.wi{display:inline-block;transition:transform var(--sweep) var(--land) var(--d,0ms)}
.r{transition:opacity var(--arrive) var(--settle) var(--d,0ms),transform var(--sweep) var(--land) var(--d,0ms),clip-path var(--stage) var(--whip) var(--d,0ms)}
.armed:not(.in) .wi{transform:translateY(105%)}
.armed:not(.in) .r-up{opacity:0;transform:translateY(48px)}
.armed:not(.in) .r-fade{opacity:0}
.armed:not(.in) .r-pop{opacity:0;transform:scale(.4)}
.r-pop{transition:opacity var(--glide) var(--settle) var(--d,0ms),transform var(--arrive) var(--pop) var(--d,0ms)}
.armed:not(.in) .r-wipe{clip-path:inset(100% 0 0 0)}
.armed:not(.in) .r-wipeL{clip-path:inset(0 100% 0 0)}
.r-wipe,.r-wipeL{clip-path:inset(0 0 0 0)}
.zoom img,.zoom video{transition:transform 1800ms var(--coast) var(--d,0ms)}
.armed:not(.in) .zoom img{transform:scale(1.14)}
.ch{display:inline-block;transition:transform var(--stage) var(--land) var(--d,0ms),opacity var(--arrive) var(--settle) var(--d,0ms)}
.armed:not(.in) .ch{transform:translateY(.6em) rotate(6deg);opacity:0}
.rule{position:relative}
.rule::before{content:"";position:absolute;left:0;right:0;top:0;height:1.5px;background:var(--rule);opacity:.4;transform-origin:left;transition:transform var(--stage) var(--whip) var(--d,0ms)}
.armed:not(.in) .rule::before{transform:scaleX(0)}
.in .drift{animation:drift 16s var(--settle) 1.6s infinite alternate}
@keyframes drift{from{transform:scale(1)}to{transform:scale(1.035)}}

/* the mark builds itself: strands climb, lines snap across, the arrow lands; then it breathes */
.mark{height:auto;overflow:visible}
.mark .lp{transform-box:fill-box;transition:transform var(--sweep) var(--land) calc(var(--k) * 70ms + 200ms),opacity var(--arrive) var(--settle) calc(var(--k) * 70ms + 200ms)}
.mark .lp-line{transform-origin:left center;transition-timing-function:var(--whip)}
.mark .lp-arrow{transition:transform var(--arrive) var(--pop) 1100ms,opacity var(--glide) var(--settle) 1100ms}
.armed:not(.in) .mark .lp-strand{transform:translateY(40%);opacity:0}
.armed:not(.in) .mark .lp-line{transform:scaleX(0)}
.armed:not(.in) .mark .lp-arrow{transform:scale(.2);opacity:0}
.in .mark{animation:breathe 5s var(--settle) 1.8s infinite alternate;transform-origin:50% 60%}
@keyframes breathe{from{rotate:-.8deg}to{rotate:.8deg}}

/* cover */
.cover-title{color:var(--spark)}
#cover .scrim{background:linear-gradient(90deg,rgba(10,33,31,.97) 0,rgba(10,33,31,.86) 38%,rgba(10,33,31,0) 62%)}
.counts{display:flex;gap:calc(52 * var(--s))}
.counts > div{display:flex;flex-direction:column;gap:calc(6 * var(--s))}
.counts .num{font-size:calc(72 * var(--s));color:var(--spark)}
.counts .t21{opacity:.8}
.hint{display:flex;align-items:center;gap:.6em;opacity:.7}
.hint kbd{font:inherit;border:1px solid currentColor;border-radius:6px;padding:.1em .45em}
.closing-title{color:var(--mint)}
.mark path{fill:var(--spark)}
#end .mark path{fill:var(--mint)}

/* index */
.ixlist{list-style:none;padding:0}
.ixlist a{display:grid;grid-template-columns:calc(110 * var(--s)) calc(430 * var(--s)) minmax(0,1fr) calc(160 * var(--s));align-items:center;gap:calc(20 * var(--s));padding-block:calc(13 * var(--s));color:inherit;text-decoration:none}
.ixlist .q{font-family:var(--serif);font-style:italic;font-size:calc(64 * var(--s));line-height:.8;transition:transform var(--arrive) var(--pop)}
.ix-name{font-size:calc(48 * var(--s));font-weight:600;letter-spacing:-.01em;transition:transform var(--sweep) var(--land)}
.ix-lede{font-size:calc(24 * var(--s));line-height:1.25;opacity:.75}
.ix-n{font-size:calc(64 * var(--s));text-align:right;color:var(--pine)}
.ixlist a:hover .ix-name{transform:translateX(calc(14 * var(--s)))}
.ixlist a:hover .q{transform:rotate(-8deg) scale(1.12)}

/* interludes: a still photo the next section covers from the bottom */
.hold{position:relative}
.interlude{position:sticky;top:0;z-index:0;scroll-snap-align:none}
.hold{scroll-snap-align:start}
.interlude .bg img{filter:brightness(var(--dim,1));transition:filter 120ms linear}
.iscrim{background:radial-gradient(ellipse 70% 60% at 50% 50%,rgba(10,33,31,.62),rgba(10,33,31,.38))}
.ihead{display:grid;place-items:center;text-align:center}
.inum{font-size:calc(120 * var(--s));line-height:1;color:var(--spark);margin-bottom:calc(10 * var(--s))}
.ititle{font-weight:500;font-size:calc(150 * var(--s));line-height:1.02;letter-spacing:-.02em;color:var(--cloud);max-width:calc(1500 * var(--s))}
.hl{position:relative;display:inline-block;isolation:isolate;color:var(--pine);padding:0 .14em .02em}
.hl::before{content:"";position:absolute;inset:.06em 0 0;background:var(--spark);z-index:-1;transform-origin:left;transition:transform var(--sweep) var(--whip) 380ms}
.armed:not(.in) .hl::before{transform:scaleX(0)}
.cover-up{z-index:1;border-top-right-radius:calc(var(--rad,0) * 1px);transform:translateZ(0)}

/* filters, cards and the pager */
.filters{display:flex;gap:calc(10 * var(--s));overflow-x:auto;scrollbar-width:none;padding-bottom:4px;mask-image:linear-gradient(90deg,#000 92%,transparent)} .filters::-webkit-scrollbar{display:none}
.fchip{flex:none;border:1.5px solid currentColor;background:none;border-radius:999px;padding:.4em .95em;font-size:calc(20 * var(--s));cursor:pointer;opacity:.7;transition:opacity var(--glide),background var(--glide) var(--settle),color var(--glide)}
.fchip:hover{opacity:1}
.fchip.on{background:var(--accent);color:var(--cbg,var(--cloud));border-color:var(--accent);opacity:1}
.g-cloud .fchip.on,.g-stone .fchip.on{--cbg:var(--cloud)} .g-pine .fchip.on{--cbg:var(--pine)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:calc(30 * var(--s)) calc(28 * var(--s))}
.card{display:block;text-align:left;background:none;border:0;padding:0;cursor:pointer;color:inherit;
  transition:opacity var(--arrive) var(--settle) var(--d,0ms),transform var(--sweep) var(--land) var(--d,0ms)}
.card.out{opacity:0;transform:translateY(40px)}
.card .vid{display:block;position:relative;aspect-ratio:16/9;border-radius:calc(18 * var(--s));overflow:hidden;background:var(--pine);
  box-shadow:0 calc(14 * var(--s)) calc(34 * var(--s)) rgba(10,33,31,.18)}
.card .vid video,.card .vid img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform var(--sweep) var(--land)}
.card:hover .vid video,.card:hover .vid img{transform:scale(1.04)}
.card .cap{display:flex;width:100%;align-items:baseline;gap:calc(12 * var(--s));margin-top:calc(14 * var(--s))}
.card b{font-size:calc(27 * var(--s));font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .what{display:block;font-size:calc(19 * var(--s));opacity:.7;margin-top:calc(4 * var(--s));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.en{flex:none;font-size:calc(17 * var(--s));border-radius:999px;padding:.25em .7em;color:var(--pine);margin-left:auto}
.en-calm,.en-soft{background:var(--sky)} .en-medium{background:var(--mint)} .en-dynamic{background:var(--spark)} .en-explosive{background:var(--peach)}
.card.pq .vid{aspect-ratio:2/1} .card.pq .quote{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-family:var(--serif);font-style:italic;font-size:calc(27 * var(--s));line-height:1.12;margin-top:calc(12 * var(--s))}
.card.pq .uses{display:block;font-size:calc(17 * var(--s));opacity:.75;margin-top:calc(6 * var(--s));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pager{display:flex;align-items:center;justify-content:flex-end;gap:calc(18 * var(--s));font-size:calc(24 * var(--s));font-variant-numeric:tabular-nums}
.pg{width:calc(56 * var(--s));height:calc(56 * var(--s));border-radius:50%;border:1.5px solid currentColor;background:none;cursor:pointer;font-size:calc(30 * var(--s));line-height:1;transition:transform var(--arrive) var(--pop),background var(--glide)}
.pg:hover{transform:scale(1.1);background:var(--accent);color:var(--cbg,var(--cloud))}
.pg:disabled{opacity:.25;pointer-events:none}

/* curves: the curve draws itself; a dot rides it (x at even speed, y on the curve) and another shows its spacing */
.curvegrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:calc(26 * var(--s)) calc(22 * var(--s))}
.cv{transition:opacity var(--arrive) var(--settle) var(--d,0ms),transform var(--sweep) var(--land) var(--d,0ms)}
.armed:not(.in) .cv{opacity:0;transform:translateY(40px)}
.cv .box{position:relative;aspect-ratio:1;border-radius:calc(16 * var(--s));background:#0E2B28;box-shadow:inset 0 0 0 1.5px rgba(247,249,242,.14)}
.cv svg{position:absolute;inset:12%;width:76%;height:76%;overflow:visible}
.cv .ax{stroke:rgba(247,249,242,.25);stroke-width:1;stroke-dasharray:2 4;fill:none}
.cv .cp{fill:none;stroke:var(--spark);stroke-width:3;stroke-linecap:round;transition:stroke-dashoffset var(--stage) var(--settle) var(--d,0ms)}
.armed:not(.in) .cv .cp{stroke-dashoffset:1}
.cv .h{stroke:var(--mint);stroke-width:1.2;opacity:.7}
.cv .hd{fill:var(--mint)}
.rx{position:absolute;left:12%;bottom:12%;width:76%;height:76%;pointer-events:none}
.rx i{position:absolute;left:0;bottom:0;width:0;height:100%;animation:rx 2.2s linear infinite;animation-play-state:paused}
.rx i b{position:absolute;left:-6px;bottom:-6px;width:12px;height:12px;border-radius:50%;background:var(--cloud);animation:ry 2.2s var(--e) infinite;animation-play-state:paused}
.in .rx i,.in .rx i b,.in .track i{animation-play-state:running}
@keyframes rx{0%,8%{left:0}82%,100%{left:100%}}
@keyframes ry{0%,8%{bottom:-6px}82%,100%{bottom:calc(100% - 6px)}}
.track{position:relative;height:calc(22 * var(--s));margin-top:calc(10 * var(--s))}
.track::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1.5px dotted rgba(247,249,242,.35)}
.track i{position:absolute;top:50%;width:calc(18 * var(--s));height:calc(18 * var(--s));margin:calc(-9 * var(--s)) 0 0 calc(-9 * var(--s));border-radius:50%;background:var(--spark);animation:tx 2.2s var(--e) infinite;animation-play-state:paused}
@keyframes tx{0%,8%{left:0}82%,100%{left:100%}}
.cv b{display:block;font-family:var(--serif);font-style:italic;font-weight:400;font-size:calc(36 * var(--s));line-height:1;margin-top:calc(8 * var(--s))}
.cv span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:calc(17 * var(--s));opacity:.72;line-height:1.25;margin-top:calc(4 * var(--s))}

/* players (styles, techniques): a list that steps by itself, the big preview wipes from one to the next */
.plist{list-style:none;padding:0;display:flex;flex-direction:column}
.pitem{display:grid;grid-template-columns:calc(70 * var(--s)) minmax(0,1fr);padding-block:calc(var(--pad,9) * var(--s));opacity:.42;cursor:pointer;transition:opacity var(--arrive) var(--settle),transform var(--sweep) var(--land) var(--d,0ms)}
.armed:not(.in) .pitem{opacity:0;transform:translateY(30px)}
.pitem.on{opacity:1}
.pitem .fn{font-family:var(--serif);font-style:italic;font-size:calc(40 * var(--s));line-height:.9;color:var(--accent)}
.pitem h3{font-size:calc(var(--h3,28) * var(--s));font-weight:600;line-height:1.1}
.pitem p{font-size:calc(21 * var(--s));line-height:1.25;margin-top:.3em;max-height:0;overflow:hidden;opacity:0;transition:max-height var(--sweep) var(--land),opacity var(--arrive) var(--settle)}
.pitem.on p{max-height:6em;opacity:.85}
.pitem .fbar{grid-column:2;display:none;height:2px;background:rgba(247,249,242,.22);margin-top:.6em;position:relative;overflow:hidden;border-radius:2px;opacity:0}
.pitem.on .fbar{display:block;opacity:1}
.pitem .fbar i{position:absolute;inset:0;background:var(--accent);transform-origin:left;transform:scaleX(0)}
.pitem.on .fbar i{animation:fill var(--per,5s) linear forwards}
@keyframes fill{to{transform:scaleX(1)}}
.pmedia{aspect-ratio:16/9;border-radius:calc(28 * var(--s));overflow:hidden;background:#000;position:relative;
  box-shadow:0 calc(28 * var(--s)) calc(70 * var(--s)) rgba(0,0,0,.32)}
.pmedia > video,.pmedia > img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;clip-path:inset(0 0 0 0);transition:clip-path var(--stage) var(--whip),transform 6s var(--coast)}
.pmedia > .enter{clip-path:inset(0 0 0 100%)}

      s.style.setProperty('--rad', (reduce ? 0 : (1 - p) * 158 * unit).toFixed(1)); under.style.setProperty('--dim', (1 - .5 * p).toFixed(3));
      if (top > -2 && top < innerHeight + 2) { const navOn = ground(top < chrome.getBoundingClientRect().bottom ? s : under), footOn = ground(top < foot.getBoundingClientRect().top ? s : under);
        [chrome, dotsEl].forEach(n => n.style.setProperty('--chrome', navOn[1])); chrome.style.setProperty('--logo', navOn[2]); foot.style.setProperty('--chrome', footOn[1]); } }); };
  const pars = [...document.querySelectorAll('.slide .bg')];
  const updatePar = () => { if (reduce || !wide()) return; pars.forEach(b => { const r = b.parentElement.getBoundingClientRect(); const c = (r.top + r.height / 2 - innerHeight / 2) / innerHeight; b.style.translate = `0 ${(c * -40).toFixed(1)}px`; }); };

  // chrome: colour, active menu item, dots, page number, progress
  const navLinks = [...document.querySelectorAll('#navlist a')];
  const numbered = slides.filter(s => !s.classList.contains('interlude'));
  numbered.forEach((s, i) => { const b = h('button', {type: 'button', 'aria-label': `${i + 1}: ${s.dataset.label}`}); b.onclick = () => s.scrollIntoView({behavior: reduce ? 'auto' : 'smooth'}); dotsEl.append(b); });
  const dots = [...dotsEl.children];
  const pageOf = i => { let n = -1; slides.slice(0, i + 1).forEach(s => { if (!s.classList.contains('interlude')) n++; }); return Math.max(0, n); };
  const progress = document.getElementById('progress'); let current = -1;
  const setCurrent = i => { if (i === current) return; current = i; const s = slides[i]; const [bg, ink, logo, bar] = ground(s);
    [chrome, foot, dotsEl].forEach(n => n.style.setProperty('--chrome', ink)); chrome.style.setProperty('--logo', logo); progress.style.setProperty('--bar', bar);
    document.documentElement.style.setProperty('--ground', bg);
    chrome.dataset.hide = (i === 0 || i === slides.length - 1) ? '1' : '0';
    navLinks.forEach(a => a.classList.toggle('on', a.dataset.sec.split(' ').includes(s.id)));
    const pg = pageOf(i); dots.forEach((d, k) => d.classList.toggle('on', k === pg));
    document.getElementById('pageno').textContent = String(pg + 1).padStart(2, '0') + ' / ' + String(numbered.length).padStart(2, '0'); setCurve(s); };
  const onScroll = () => { const mid = innerHeight * .5; let idx = 0;
    slides.forEach((s, i) => { const r = s.getBoundingClientRect(); if (r.top <= mid) idx = i; });
    setCurrent(idx); updatePar(); updateCovers();
    const max = document.documentElement.scrollHeight - innerHeight; progress.style.transform = `scaleX(${max > 0 ? scrollY / max : 0})`; };
  addEventListener('scroll', onScroll, {passive: true}); addEventListener('resize', onScroll); onScroll();

  // presenting: keys step through every section; into and out of an interlude the page glides on Settle (1500 ms)
  const posOf = n => (n.classList.contains('interlude') ? n.parentElement : n).getBoundingClientRect().top + scrollY;
  const stops = () => [...document.querySelectorAll('.slide')].sort((a, b) => posOf(a) - posOf(b));
  const at = () => { const list = stops(); let k = 0; list.forEach((n, i) => { if (posOf(n) - scrollY <= innerHeight * .4) k = i; }); return [list, k]; };
  const settle = bez(...CURVES.Settle); let gliding = false;
  const glideTo = (y, dur = 1500) => { const html = document.documentElement, y0 = scrollY, t0 = performance.now(); gliding = true; html.style.scrollSnapType = 'none'; html.style.scrollBehavior = 'auto';
    const step = now => { const p = Math.min(1, (now - t0) / dur); scrollTo(0, y0 + (y - y0) * settle(p)); if (p < 1) requestAnimationFrame(step); else { html.style.scrollSnapType = ''; html.style.scrollBehavior = ''; setTimeout(() => { gliding = false; }, 380); } };
    requestAnimationFrame(step); };
  const soft = (a, b) => !reduce && wide() && a && b && a !== b && (a.classList.contains('interlude') || b.classList.contains('interlude'));
  const go = d => { const [list, k] = at(); const from = list[k], t = list[Math.max(0, Math.min(list.length - 1, k + d))];
    if (soft(from, t)) glideTo(posOf(t)); else t.scrollIntoView({behavior: reduce ? 'auto' : 'smooth', block: 'start'}); };
  addEventListener('wheel', e => { if (sheet.classList.contains('open')) return; if (gliding) { e.preventDefault(); return; } if (Math.abs(e.deltaY) < 4 || e.ctrlKey) return;
    const [list, k] = at(), t = list[k + Math.sign(e.deltaY)]; if (soft(list[k], t) && Math.abs(posOf(list[k]) - scrollY) < 8) { e.preventDefault(); glideTo(posOf(t)); } }, {passive: false});
  addEventListener('keydown', e => { if (e.target.closest('input,textarea') || sheet.classList.contains('open')) return;
    if (gliding && ['ArrowDown','PageDown','ArrowUp','PageUp',' '].includes(e.key)) { e.preventDefault(); return; }
    if (['ArrowDown','PageDown'].includes(e.key) || (e.key === ' ' && !e.shiftKey)) { e.preventDefault(); go(1); }
    else if (['ArrowUp','PageUp'].includes(e.key) || (e.key === ' ' && e.shiftKey)) { e.preventDefault(); go(-1); }
    else if (e.key === 'Home') { e.preventDefault(); slides[0].scrollIntoView(); } else if (e.key === 'End') { e.preventDefault(); slides.at(-1).scrollIntoView(); } });
  // menu links glide like the keys do
  document.querySelectorAll('a[href^="#"]').forEach(a => a.addEventListener('click', e => { const t = document.getElementById(a.getAttribute('href').slice(1)); if (!t) return; e.preventDefault();
    const target = t.classList.contains('cover-up') ? t.previousElementSibling : t; if (!reduce && wide()) glideTo(posOf(target), 1300); else target.scrollIntoView(); }));
  if (location.hash) { const t = document.getElementById(location.hash.slice(1)); if (t) setTimeout(() => t.scrollIntoView(), 50); }
})();
