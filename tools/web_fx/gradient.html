<!doctype html>
<!-- Motion DNA web FX · living mesh gradient (OGL 1.0.11, Unlicense): four token colours drift and blend on a
     fragment shader, with grain; a background that loops cleanly every `loop` seconds. Options (location.hash JSON):
     colors (4), loop (s), grain (0-1). Opaque: render it with --mp4. Rendered by tools/web_capture.py. -->
<meta charset="utf-8"><title>gradient</title>
<style>html, body { margin: 0; background: transparent; overflow: hidden; } #stage { position: relative; } canvas { display: block; }</style>
<div id="stage"></div>
<script type="module">
import { Renderer, Program, Mesh, Triangle, Vec3 } from "https://cdn.jsdelivr.net/npm/ogl@1.0.11/+esm";
const o = JSON.parse(decodeURIComponent(location.hash.slice(1) || "{}")), st = document.getElementById("stage");
st.style.width = o.w + "px"; st.style.height = o.h + "px";
const hex = h => new Vec3(...[1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255));
const C = (o.colors && o.colors.length >= 4 ? o.colors : ["#0A211F", "#174A46", "#9FD8C2", "#D8FF85"]).slice(0, 4).map(hex);
const renderer = new Renderer({ width: o.w, height: o.h, dpr: 1, alpha: false, preserveDrawingBuffer: true }), gl = renderer.gl;
st.appendChild(gl.canvas);
const program = new Program(gl, {
  vertex: "attribute vec2 position; attribute vec2 uv; varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position, 0.0, 1.0); }",
  fragment: `precision highp float; varying vec2 vUv; uniform float uPhase, uGrain, uRatio; uniform vec3 c0, c1, c2, c3;
    float h(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    void main() { vec2 p = vec2(vUv.x * uRatio, vUv.y); float a = uPhase * 6.2831853;
      vec2 q0 = vec2(0.25 * uRatio + 0.18 * cos(a), 0.3 + 0.12 * sin(a)), q1 = vec2(0.8 * uRatio + 0.15 * sin(a), 0.75 + 0.1 * cos(2.0 * a)),
           q2 = vec2(0.6 * uRatio + 0.2 * cos(a + 2.1), 0.2 + 0.15 * sin(a + 1.3)), q3 = vec2(0.3 * uRatio + 0.2 * sin(a + 4.0), 0.85 + 0.08 * cos(a + 0.5));
      float w0 = 1.0 / pow(distance(p, q0) + 0.08, 2.2), w1 = 1.0 / pow(distance(p, q1) + 0.08, 2.2), w2 = 0.7 / pow(distance(p, q2) + 0.1, 2.4), w3 = 0.45 / pow(distance(p, q3) + 0.12, 2.6);
      vec3 col = (c0 * w0 + c1 * w1 + c2 * w2 + c3 * w3) / (w0 + w1 + w2 + w3);
      col += (h(gl_FragCoord.xy + uPhase * 97.0) - 0.5) * uGrain * 0.08; gl_FragColor = vec4(col, 1.0); }`,
  uniforms: { uPhase: { value: 0 }, uGrain: { value: o.grain ?? 0.6 }, uRatio: { value: o.w / o.h }, c0: { value: C[0] }, c1: { value: C[1] }, c2: { value: C[2] }, c3: { value: C[3] } },
});
const mesh = new Mesh(gl, { geometry: new Triangle(gl), program });
window.FX_START = () => { const t0 = performance.now(), L = o.loop ?? 8; const f = () => { program.uniforms.uPhase.value = ((performance.now() - t0) / 1000 / L) % 1; renderer.render({ scene: mesh }); requestAnimationFrame(f); }; f(); };
window.FX_READY = true;
</script>
