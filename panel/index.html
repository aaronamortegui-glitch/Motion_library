<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Motion DNA</title>
  <script>   // load the stylesheet and scripts fresh every time (F5 after an update must not run cached code)
    window.__v = Date.now();
    // The installed (signed) panel is only a shell: its styles and scripts come from the Motion DNA clone it points to
    // (.root, written by setup.py), so a git pull shows up in the panel without reinstalling it.
    window.__base = "";
    try {
      var here = decodeURI(location.pathname).replace(/^\/([A-Za-z]:)/, "$1").replace(/\/[^\/]*$/, "");
      var r = window.cep && window.cep.fs.readFile(here + "/.root");
      if (r && r.err === 0) {
        var root = r.data.replace(/^\s+|\s+$/g, "").replace(/\\/g, "/");
        if (window.cep.fs.stat(root + "/panel/js/app.js").err === 0) window.__base = "file:///" + encodeURI(root.replace(/^\//, "")).replace(/#/g, "%23") + "/panel/";
      }
    } catch (e) {}
    document.write('<link rel="stylesheet" href="' + window.__base + 'css/panel.css?v=' + window.__v + '">');
  </script>
</head>
<body>
  <!-- header: name · MCP status · how to use · visualizer -->
  <header class="top">
    <span class="title">Motion DNA</span>
    <div class="status" id="status">
      <button id="mcp" title="After Effects bridge (MCP): checking…"><i class="dot"></i>MCP</button>
      <button id="st-claude" title="Claude Code sign-in (Agent): checking…"><i class="dot"></i>Claude</button>
      <button id="st-figma" title="Figma (Agent, Full mode): checking…"><i class="dot"></i>Figma</button>
    </div>
    <button class="brandchip" id="brandchip" hidden></button>
    <span class="grow"></span>
    <button class="icon" id="help" title="How to use: connect Claude and what you can ask it">
      <svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="7.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M7.8 7.6a2.3 2.3 0 1 1 3.3 2.1c-.7.3-1.1.8-1.1 1.5v.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="10" cy="14.3" r=".9" fill="currentColor"/></svg>
    </button>
    <button class="icon" id="visualizer" title="Visualizer: open the library gallery in your browser (every preset, style and curve)">
      <svg viewBox="0 0 20 20"><rect x="3" y="3" width="6" height="6" rx="1.5"/><rect x="11" y="3" width="6" height="6" rx="1.5"/><rect x="3" y="11" width="6" height="6" rx="1.5"/><rect x="11" y="11" width="6" height="6" rx="1.5"/></svg>
    </button>
  </header>

  <main id="main">
    <div id="boot" class="note">Loading the library…</div>
    <section id="sec-behaviors" class="section" hidden></section>
    <section id="sec-curves" class="section" hidden></section>
    <section id="sec-brands" class="section" hidden></section>
    <section id="sec-agent" class="section" hidden></section>
  </main>

  <!-- sections -->
  <nav class="tabs" id="tabs">
    <button data-sec="behaviors" title="Behaviors: the animation presets (moves, text, loops, transitions, recipes)">
      <svg viewBox="0 0 24 24"><path d="M2 7h5M0 12h8M2 17h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M10 5l11 7-11 7z" fill="currentColor"/></svg><span>Behaviors</span></button>
    <button data-sec="curves" title="Curves: the easing library and a curve editor for selected keyframes">
      <svg viewBox="0 0 24 24"><path d="M3 21V3M3 21h18" stroke="currentColor" stroke-width="1.4" opacity=".55"/><path d="M3 21C14 21 6 3 21 3" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="14" cy="21" r="2.4" fill="currentColor"/><circle cx="6" cy="3" r="2.4" fill="currentColor"/></svg><span>Curves</span></button>
    <button data-sec="brands" title="Brands: brand motion guidelines and their rules">
      <svg viewBox="0 0 24 24"><rect x="4" y="2.5" width="16" height="19" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M13 2.5h5v8l-2.5-2-2.5 2z" fill="currentColor"/><path d="M7.5 15h9M7.5 18h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span>Brands</span></button>
    <button data-sec="agent" title="Agent: give Claude an order; its Library has the Styles and Techniques, its Project keeps the folder and the conversation">
      <svg viewBox="0 0 24 24"><path d="M4 4.5h16a1.5 1.5 0 0 1 1.5 1.5v9A1.5 1.5 0 0 1 20 16.5h-9l-5 4v-4H4A1.5 1.5 0 0 1 2.5 15V6A1.5 1.5 0 0 1 4 4.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 7.2l.9 2.4 2.4.9-2.4.9-.9 2.4-.9-2.4-2.4-.9 2.4-.9z" fill="currentColor"/></svg><span>Agent</span></button>
  </nav>

  <div class="toast" id="toast" hidden></div>
  <script>
    document.write('<script src="' + window.__base + 'js/host.js?v=' + window.__v + '"><\/script>');
    document.write('<script src="' + window.__base + 'js/app.js?v=' + window.__v + '"><\/script>');
    document.write('<script src="' + window.__base + 'js/agent.js?v=' + window.__v + '"><\/script>');
  </script>
</body>
</html>
