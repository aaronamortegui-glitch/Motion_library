<!doctype html>
<meta charset="utf-8">
<title>T09 · Particle world</title>
<script src="../runtime/mdna.js"></script>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
<script>
// T09 · particle environment (archetype "a place drawn with thousands of glowing specks, the time of day changes").
// v3 after QA: a sea of round specks that drifts towards the camera all the way to the horizon, a sun clipped to the
// sky with its own squashed reflection and a road of light, a pier silhouette with a Ferris wheel of lights standing
// on it (reflected in the water), glowing ribbons on the swell, stars at dusk, a soft horizon haze and a slow camera
// push. A true 12 s loop: every motion runs a whole number of cycles per loop (u = t / DUR), so frame 0 follows 11.967.
const VARS = { day: [159, 216, 194], dusk: [255, 138, 107], title: "Golden *hour.*" };
const { T, seg, lerp, clamp, rng, glow, rich, finish } = MDNA, C = T.color;
const cv = document.getElementById("c"), D = MDNA.draw(cv), g = D.g, W = 1920, H = 1080, DUR = 12, HZ = 560, F = 900, R = rng(9);
const TAU = Math.PI * 2, CAMH = 260, ZN = 440, ZF = 9000, LZ = Math.log(ZF / ZN);
// specks: w = depth phase (0 near … 1 at the horizon, log-spaced), xn = lateral position in screen units
const sea = Array.from({ length: 14000 }, () => [R(), R() * 2 - 1, R()]);
const stars = Array.from({ length: 420 }, () => [R() * W, R() * HZ * 0.8, R()]);
const mix = (a, b, p) => a.map((v, i) => Math.round(lerp(v, b[i], p)));
const rgb = c => `rgb(${c.join(",")})`, rgba = (c, a) => `rgba(${c.join(",")},${a})`;
const PINE = [10, 33, 31], SEA = [23, 74, 70], INK = [4, 18, 15], MINT = [159, 216, 194], CORAL = [255, 138, 107], CLOUD = [247, 249, 242];
const WX = W * 0.22, DECK = HZ - 10, FR = 150, HUB = DECK - FR - 34;   // pier deck on the horizon, wheel standing on it

function wheel(u, col, lights) {   // pier + wheel; lights = 1 for the real one, < 1 for the reflection
  const rot = u * TAU / 8;          // one eighth of a turn per loop: 8 spokes, so the loop is seamless
  g.fillStyle = "#04120F"; g.strokeStyle = "#04120F";
  // the pier: a low deck on pilings, running off the left edge
  g.fillRect(-20, DECK - 6, WX + 260, 8); for (let x = 0; x < WX + 240; x += 46) g.fillRect(x, DECK, 4, HZ - DECK + 3);
  g.fillRect(WX + 236, DECK - 26, 3, 20);
  // A-frame legs and the rim
  g.lineWidth = 6; g.beginPath(); g.moveTo(WX - 80, DECK - 4); g.lineTo(WX, HUB); g.lineTo(WX + 80, DECK - 4); g.stroke();
  g.lineWidth = 4; g.beginPath(); g.arc(WX, HUB, FR, 0, TAU); g.stroke(); g.lineWidth = 2; g.beginPath(); g.arc(WX, HUB, FR - 14, 0, TAU); g.stroke();
  g.lineWidth = 1.5; for (let s = 0; s < 16; s++) { const a = rot + s / 16 * TAU; g.beginPath(); g.moveTo(WX, HUB); g.lineTo(WX + Math.cos(a) * FR, HUB + Math.sin(a) * FR); g.stroke(); }
  g.beginPath(); g.arc(WX, HUB, 9, 0, TAU); g.fill();
  // gondolas hang under the rim (8, so they match the turn)
  for (let s = 0; s < 8; s++) { const a = rot + s / 8 * TAU, x = WX + Math.cos(a) * FR, y = HUB + Math.sin(a) * FR; g.fillRect(x - 9, y + 4, 18, 14);
    g.save(); g.globalCompositeOperation = "lighter"; g.fillStyle = `rgba(255,214,150,${0.75 * lights})`; g.fillRect(x - 6, y + 8, 12, 5); g.restore(); }
  // lights: bulbs on the rim (accent every 10th, period 1/16 turn) and lamps on the deck, with a soft bloom
  g.save(); g.globalCompositeOperation = "lighter";
  for (let i = 0; i < 160; i++) { const a = rot + i / 160 * TAU, x = WX + Math.cos(a) * FR, y = HUB + Math.sin(a) * FR, acc = i % 10 === 0;
    g.fillStyle = acc ? `rgba(216,255,133,${lights})` : rgba(col, 0.85 * lights); g.beginPath(); g.arc(x, y, acc ? 3 : 1.8, 0, TAU); g.fill(); }
  for (let x = 30; x < WX + 240; x += 92) glow(g, x, DECK - 9, 9, "#FFD696", 0.9 * lights);
  glow(g, WX, HUB, FR * 1.5, rgb(col), 0.12 * lights); g.restore();
}

MDNA.scene({ duration: DUR, background: C.ink, render(t) {
  const u = t / DUR, ph = u * TAU, dusk = 0.5 - 0.5 * Math.cos(ph), col = mix(VARS.day, VARS.dusk, dusk);
  const top = mix(SEA, PINE, dusk), mid = mix([60, 140, 125], mix(SEA, CORAL, 0.45), dusk), hor = mix(MINT, CORAL, dusk);
  // camera: a slow push in and back out over the loop, around the horizon line
  const Z = 1 + 0.045 * (0.5 - 0.5 * Math.cos(ph));
  // sky and sea fills (full frame, outside the camera transform)
  const sky = g.createLinearGradient(0, 0, 0, HZ); sky.addColorStop(0, rgb(top)); sky.addColorStop(0.62, rgb(mid)); sky.addColorStop(1, rgb(hor));
  g.fillStyle = sky; g.fillRect(0, 0, W, HZ + 1);
  const wat = g.createLinearGradient(0, HZ, 0, H); wat.addColorStop(0, rgb(mix(INK, hor, 0.25))); wat.addColorStop(0.35, rgb(mix(INK, SEA, 0.45))); wat.addColorStop(1, rgb(INK));
  g.fillStyle = wat; g.fillRect(0, HZ, W, H - HZ);
  g.save(); g.translate(W / 2, HZ); g.scale(Z, Z); g.translate(-W / 2, -HZ);
  // stars at dusk (twinkle 8 cycles per loop)
  g.fillStyle = "#F7F9F2"; stars.forEach(([x, y, r]) => D.alpha(dusk * dusk * (0.25 + 0.6 * r) * (0.65 + 0.35 * Math.sin(ph * 8 + x)), () => g.fillRect(x, y, 2, 2)));
  // the sun, clipped to the sky; its reflection squashed under the horizon
  const sunX = W * 0.62, sunY = lerp(HZ - 280, HZ - 40, dusk), sunC = rgb(mix([216, 255, 133], [255, 170, 120], dusk));
  g.save(); g.beginPath(); g.rect(-200, -200, W + 400, HZ + 200); g.clip(); g.beginPath(); g.arc(sunX, sunY, 46, 0, TAU); g.fillStyle = "#FFF6DA"; g.fill();
  glow(g, sunX, sunY, 700, sunC, 0.5); glow(g, sunX, sunY, 170, "#FFF6DA", 0.95); g.restore();
  g.save(); g.beginPath(); g.rect(-200, HZ, W + 400, H); g.clip(); g.translate(0, HZ); g.scale(1, 0.25); glow(g, sunX, HZ - sunY, 520, sunC, 0.4); glow(g, sunX, HZ - sunY, 150, "#FFF6DA", 0.4); g.restore();
  // the sea: specks drift towards the camera (one depth cycle per loop), brighter in the sun's road
  const buckets = new Map();
  for (const [w, xn, r] of sea) {
    const wp = ((w - u) % 1 + 1) % 1, z = ZN * Math.exp(LZ * wp);
    const y = CAMH + 14 * Math.sin(xn * 9 + z * 0.012 + ph * 3), sy = HZ + y / z * F, sx = W / 2 + xn * (W / 2 + 80) * (1 + 0.35 * (1 - wp));
    if (sx < -4 || sx > W + 4 || sy > H + 4) continue;
    const sig = 50 + 330 * (1 - wp), road = Math.exp(-((sx - sunX) ** 2) / (2 * sig * sig));
    const fade = clamp((1 - wp) / 0.12) * clamp(wp / 0.02), a = fade * (0.28 + 0.4 * (1 - wp)) * (0.55 + 1.3 * road * (0.4 + 0.6 * Math.sin(r * 40 + ph * 11)));
    const s = lerp(2.4, 0.8, Math.sqrt(wp)) * (1 + 0.4 * road), key = (road > 0.35 ? "w" : "c") + Math.round(Math.min(1, a) * 10) + "|" + Math.round(s * 2);
    let b = buckets.get(key); if (!b) buckets.set(key, b = { hot: road > 0.35, a: Math.round(Math.min(1, a) * 10) / 10, s: Math.round(s * 2) / 2, pts: [] }); b.pts.push(sx, sy);
  }
  g.save(); g.globalCompositeOperation = "lighter";
  buckets.forEach(b => { if (b.a <= 0) return; g.fillStyle = b.hot ? `rgba(255,236,190,${b.a})` : rgba(col, b.a); g.beginPath();
    for (let i = 0; i < b.pts.length; i += 2) { g.moveTo(b.pts[i] + b.s, b.pts[i + 1]); g.arc(b.pts[i], b.pts[i + 1], b.s, 0, TAU); } g.fill(); });
  // glowing ribbons riding the swell (3 cycles of drift and 10 of shimmer per loop)
  g.lineCap = "round"; g.lineWidth = 2.5; g.shadowColor = C.spark; g.shadowBlur = 10;
  for (let rb = 0; rb < 3; rb++) for (let i = 0; i < 120; i++) { const u0 = i / 120, u1 = (i + 1) / 120, yy = q => HZ + 80 + rb * 60 + 12 * Math.sin(q * 7 + ph * 3 + rb * 0.7);
    const a = 0.6 * Math.sin(u0 * Math.PI) * clamp(0.5 + 0.5 * Math.sin(u0 * 26 - ph * 10 + rb * 1.7));
    if (a < 0.03) continue; g.strokeStyle = `rgba(216,255,133,${a})`; g.beginPath(); g.moveTo(lerp(-80, W + 80, u0), yy(u0)); g.lineTo(lerp(-80, W + 80, u1), yy(u1)); g.stroke(); }
  g.restore();
  // pier and wheel, then their reflection (flipped, squashed, faint) under the horizon
  wheel(u, col, 1);
  g.save(); g.beginPath(); g.rect(-200, HZ, W + 400, H); g.clip(); g.globalAlpha = 0.28; g.translate(0, HZ); g.scale(1, -0.45); g.translate(0, -HZ); wheel(u, col, 0.6); g.restore();
  // a soft 40 px haze on the horizon instead of a hard line
  const hz = g.createLinearGradient(0, HZ - 40, 0, HZ + 40); hz.addColorStop(0, rgba(hor, 0)); hz.addColorStop(0.5, rgba(mix(hor, CLOUD, 0.4), 0.35 + 0.25 * dusk)); hz.addColorStop(1, rgba(hor, 0));
  g.fillStyle = hz; g.fillRect(-200, HZ - 40, W + 400, 80);
  g.restore();
  const e = seg(t, 3.5, 4.2, "Land") * (1 - seg(t, 7.0, 7.6, "Launch")); D.alpha(e, () => rich(D, VARS.title, W / 2, 210 + 16 * (1 - e), 120, C.cloud, C.spark, "center", 600));
  finish(g, t, { grain: 0.06, vignette: 0.35 });
} });
</script>
