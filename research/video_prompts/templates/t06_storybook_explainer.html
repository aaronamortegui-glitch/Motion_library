<!doctype html>
<meta charset="utf-8">
<title>T06 · Storybook explainer</title>
<script src="../runtime/mdna.js"></script>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
<script>
// T06 · storybook explainer with a character (archetype "the journey of a photon, given a personality").
// v3 (QA): the three worlds are stacked like a camera tilt (space → clouds → ground) and Pip dives through a cloud bank
// between them, so every scene change is a designed wipe carried by the character. Pip's trail is his real path (world
// drift included), the dodged drops are the counter, a teardrop splashes him, the leaf lights up from its stem, and the
// end is a slow push on the sunrise. Every colour is a token or a mix of two tokens.
// Hybrid route: captions, counters and annotations are text in AE; --notext gives the plate.
const VARS = { hero: "a photon", caps: ["It leaves the Sun at the speed of light…", "…dodges clouds and rain…", "…and wakes up a leaf."],
               stats: [["Distance", 150000000, " km"], ["Travel time", "8 min 20 s", ""], ["Drops dodged", 12, ""]], end: "and the leaf *wakes up.*" };
const { T, seg, k, lerp, clamp, rng, NOTEXT, glow, rich, kicker, finish } = MDNA, C = T.color;
const cv = document.getElementById("c"), D = MDNA.draw(cv), g = D.g, W = 1920, H = 1080;
const rgb = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
const mix = (a, b, p) => "#" + rgb(a).map((v, i) => Math.round(lerp(v, rgb(b)[i], p)).toString(16).padStart(2, "0")).join("");
const al = (c, a) => c + Math.round(clamp(a) * 255).toString(16).padStart(2, "0");
const bump = (x, w) => Math.exp(-(x / w) * (x / w));

// ---- timeline: world 1 space [0, 4.4], cloud bank 1 [4.4, 5.4], world 2 weather, cloud bank 2 [9.3, 10.3], world 3 ground
const TR1 = [4.4, 5.4], TR2 = [9.3, 10.3], HIT = 8.3, LAND = [10.3, 11.6];
const NDROPS = Math.min(20, Math.max(1, Math.round(+VARS.stats[2][1]) || 12));   // the hero drops ARE the counter
const dropT = j => 5.8 + j * 2.1 / NDROPS, dropSide = j => (j % 3 === 1 ? -1 : 1) * (j % 2 ? -1 : 1);

// Pip's path on screen: a smooth spline through the beats (no stops between keys)
const KEYS = [[0, 430, 560], [2.2, 760, 590], [4.4, 1080, 610], [5.5, 1000, 430], [6.6, 860, 520], [7.6, 960, 550], [HIT, 920, 560], [9.3, 980, 600], [10.3, 990, 400]];
function spline(t) {
  if (t <= KEYS[0][0]) return [KEYS[0][1], KEYS[0][2]]; const n = KEYS.length - 1; if (t >= KEYS[n][0]) return [KEYS[n][1], KEYS[n][2]];
  let i = 0; while (KEYS[i + 1][0] < t) i++;
  const K = j => KEYS[Math.max(0, Math.min(n, j))], t0 = K(i)[0], t1 = K(i + 1)[0], u = (t - t0) / (t1 - t0);
  const m = (j, c) => (K(j + 1)[c] - K(j - 1)[c]) / (K(j + 1)[0] - K(j - 1)[0]) * (t1 - t0);
  const h = (c) => { const p0 = K(i)[c], p1 = K(i + 1)[c], u2 = u * u, u3 = u2 * u;
    return (2 * u3 - 3 * u2 + 1) * p0 + (u3 - 2 * u2 + u) * m(i, c) + (-2 * u3 + 3 * u2) * p1 + (u3 - u2) * m(i + 1, c); };
  return [h(1), h(2)];
}
// world 3 camera: a slow, constant push that runs to the last frame
const LEAF = { x: 880, y: 600, r: -0.26 }, push = t => 1 + 0.06 * clamp((t - 9.6) / 5.4);
const scr = (x, y, z) => [W / 2 + (x - W / 2) * z, H / 2 + (y - H / 2) * z];
const leafTip = () => [LEAF.x - 420 * Math.cos(LEAF.r), LEAF.y - 420 * Math.sin(LEAF.r)];
// the world's drift under the camera (stars, clouds, the tilts): Pip's trail is his path through the world, not the screen
const cam = t => [k(t, [[0, 0], [TR1[0], 900, "Flat"], [TR1[1], 1100, "Flat"], [TR2[0], 1660, "Flat"], [TR2[1], 1760, "Flat"], [11.2, 1790, "Land"]]),
                  k(t, [[TR1[0], 0], [TR1[1], 900, "Surge"], [TR2[0], 900], [TR2[1], 1800, "Surge"]])];

function pipAt(t) {
  let [x, y] = spline(t), s = 1.5, rot = 0, sq = 0, mood = t > HIT ? 1 : 0;
  y += 26 * Math.sin(t * 2.2) * (1 - seg(t, 3.4, 4.4));                                  // floating in space
  for (let j = 0; j < NDROPS; j++) { const b = bump(t - dropT(j), 0.08); x -= dropSide(j) * 30 * b; rot -= dropSide(j) * 0.18 * b; }   // leans away
  const hit = seg(t, HIT, HIT + 0.08, "Flat") * (1 - seg(t, HIT + 0.08, HIT + 0.6, "Pop")); y += 34 * hit; sq = hit;
  if (t > LAND[0]) {                                                                       // lands on the leaf's stem
    const z = push(t), tp = leafTip(), [tx, ty] = scr(tp[0] - 4, tp[1] - 58, z), l = seg(t, LAND[0], LAND[1], "Land");
    x = lerp(x, tx, l); y = lerp(y, ty, l) - 110 * Math.sin(Math.PI * l) * (1 - l) + 5 * Math.sin((t - LAND[1]) * 2.4) * seg(t, LAND[1], LAND[1] + 0.6);
    s = lerp(1.5, 1.3 * z, l); const touch = bump(t - LAND[1] + 0.05, 0.12); sq = Math.max(sq, 0.45 * touch);
  }
  return { x, y, s, rot, sq, mood };
}
function trail(t, P) {   // a tapered ribbon along Pip's last 0.6 s in the world (so it shows speed in any direction)
  const c = cam(t), pts = [[P.x, P.y]]; let len = 0;
  for (let i = 1; i <= 40; i++) { const tt = Math.max(0, t - i * 0.015), q = pipAt(tt), cq = cam(tt), x = q.x + cq[0] - c[0], y = q.y + cq[1] - c[1];
    len += Math.hypot(x - pts[pts.length - 1][0], y - pts[pts.length - 1][1]); if (len > 760) break; pts.push([x, y]); }
  if (len < 4) return;
  const ribbon = (wd, col, a) => { const L = [], R = []; pts.forEach((p, i) => { const p0 = pts[Math.max(0, i - 1)], p1 = pts[Math.min(pts.length - 1, i + 1)];
      let dx = p1[0] - p0[0], dy = p1[1] - p0[1], d = Math.hypot(dx, dy) || 1, w = wd * P.s * (1 - i / pts.length) / 2; L.push([p[0] - dy / d * w, p[1] + dx / d * w]); R.push([p[0] + dy / d * w, p[1] - dx / d * w]); });
    g.beginPath(); L.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); R.reverse().forEach(p => g.lineTo(p[0], p[1])); g.closePath(); D.alpha(a, () => D.fill(col)); };
  ribbon(76, C.spark, 0.22); ribbon(44, C.spark, 0.45); ribbon(12, C.cloud, 0.7);
}
function pipDraw(P, t, glowA = 0.55) {   // the character: a glowing spark with eyes and moods
  glow(g, P.x, P.y, 170 * P.s, C.spark, glowA);
  D.at(P.x, P.y, P.s, P.rot, () => { g.scale(1 + 0.35 * P.sq, 1 - 0.3 * P.sq);
    g.beginPath(); g.arc(0, 0, 40, 0, 7); D.fill(C.spark); g.beginPath(); g.arc(-12, -14, 12, 0, 7); D.alpha(0.6, () => D.fill(C.cloud));
    const blink = (t % 2.7) < 0.12 ? 0.15 : 1, eh = lerp(7, 12, P.mood) * blink;
    [-13, 13].forEach(ex => { g.beginPath(); g.ellipse(ex, -2, 6, eh, 0, 0, 7); D.fill(C.pine); });
    [-24, 24].forEach(ex => { g.beginPath(); g.ellipse(ex, 10, 7, 4, 0, 0, 7); D.alpha(0.35, () => D.fill(C.coral)); });
    g.beginPath(); if (P.mood > 0.5) { g.arc(0, 16, 7, 0, 7); D.fill(C.pine); } else { g.arc(0, 12, 12, 0.15 * Math.PI, 0.85 * Math.PI); g.strokeStyle = C.pine; g.lineWidth = 4; g.lineCap = "round"; g.stroke(); }
  });
}

// ---- text (hybrid: --notext leaves the plate)
function caption(i, a, b, t) { if (NOTEXT) return; const p = seg(t, a, a + 0.47, "Land") * (1 - seg(t, b - 0.3, b, "Launch")); if (p <= 0) return; D.alpha(p, () => {
  const s = VARS.caps[i], w = D.width(s, 46, 400, T.font.display) + 80; D.rr(W / 2 - w / 2, 940 + 20 * (1 - p), w, 84, 42); D.fill(al(C.ink, 0.8)); D.txt(s, W / 2, 984 + 20 * (1 - p), 46, C.cloud, 400, T.font.display); }); }
function stat(i, a, b, t, y, val, full, pop = 0) { if (NOTEXT) return; const p = seg(t, a, a + 0.47, "Land") * (1 - seg(t, b - 0.35, b, "Launch")); if (p <= 0) return;
  const w = Math.max(D.width(full, 64, 800, T.font.ui, -1), D.width(VARS.stats[i][0].toUpperCase(), 24, 600, T.font.ui, 7.7)) + 72, x = 1840 - w + 40 * (1 - p);
  D.alpha(p, () => { D.rr(x, y - 70, w, 150, 22); D.fill(al(C.ink, 0.72)); g.strokeStyle = al(C.spark, 0.2); g.lineWidth = 2; g.stroke();
    kicker(D, VARS.stats[i][0], x + 36, y - 30, C.mint, "left", 24);
    D.at(x + 36, y + 32, 1 + 0.12 * pop, 0, () => D.txt(val, 0, 0, 64, pop > 0.05 ? mix(C.cloud, C.spark, pop) : C.cloud, 800, T.font.ui, "left", -1)); }); }
function note(s, P, a, t) {   // hand-written annotation that travels with Pip (constant arrow)
  if (NOTEXT) return; const p = seg(t, a, a + 0.6, "Cruise"), gone = seg(t, a + 1.6, a + 2.0, "Launch"); if (p <= 0 || gone >= 1) return;
  const x = P.x - 250, y = P.y - 160;
  D.alpha(Math.min(1, p * 2) * (1 - gone), () => { D.txt(s, x, y, 40, C.cloud, 400, T.font.display, "left"); g.save(); g.setLineDash([300]); g.lineDashOffset = 300 * (1 - p);
    g.beginPath(); g.moveTo(x + 70, y + 26); g.quadraticCurveTo(x + 90, y + 100, P.x - 58, P.y - 52); g.strokeStyle = C.cloud; g.lineWidth = 3; g.lineCap = "round"; g.stroke(); g.restore(); });
}

// ---- world 1 · space
function space(t) {
  const sky = g.createLinearGradient(0, 0, W, H); sky.addColorStop(0, mix(C.sea, C.ink, 0.45)); sky.addColorStop(1, C.ink); g.fillStyle = sky; g.fillRect(-60, -400, W + 120, H + 800);
  const R = rng(4); for (let l = 0; l < 3; l++) for (let i = 0; i < 90; i++) { const x = ((R() * W * 1.5 - t * (40 + l * 120)) % (W * 1.5) + W * 1.5) % (W * 1.5) - 100, y = R() * (H + 300), tw = 0.5 + 0.5 * Math.sin(t * 3 + i);
    g.beginPath(); g.arc(x, y, 0.8 + l * 0.9, 0, 7); D.alpha((0.25 + l * 0.25) * (0.6 + 0.4 * tw), () => D.fill(C.cloud)); }
  // the Sun: layered glow, a granular surface and a rotating particle corona
  const sx = -60 - t * 30, sy = H / 2, warm = mix(C.coral, C.cloud, 0.45); glow(g, sx, sy, 900, C.coral, 0.55); glow(g, sx, sy, 520, warm, 0.8);
  g.beginPath(); g.arc(sx, sy, 330, 0, 7); const sg = g.createRadialGradient(sx + 60, sy - 40, 20, sx, sy, 330); sg.addColorStop(0, C.cloud); sg.addColorStop(0.6, warm); sg.addColorStop(1, C.coral); g.fillStyle = sg; g.fill();
  const Rc = rng(5); for (let i = 0; i < 420; i++) { const a = Rc() * 7 + t * (0.05 + Rc() * 0.1), r = 340 + Rc() * 180 + 30 * Math.sin(t * 2 + i); g.fillStyle = Rc() < 0.5 ? mix(C.cloud, C.coral, 0.2) : C.coral;
    D.alpha(0.5 + 0.5 * Rc(), () => g.fillRect(sx + Math.cos(a) * r, sy + Math.sin(a) * r, 3, 3)); }
}

// ---- world 2 · weather: three depths of shaded clouds lit by Pip, rain by depth, hero drops, the splash
const PUFFS = [[0, 0, 80], [70, -30, 95], [160, 0, 85], [90, 20, 90], [-60, 15, 60], [230, 18, 58], [-20, 50, 52], [60, 58, 56], [140, 56, 58], [210, 48, 50]];
function cloudPath(x, y, s) { g.beginPath(); PUFFS.forEach(([dx, dy, r]) => { g.moveTo(x + dx * s + r * s, y + dy * s); g.arc(x + dx * s, y + dy * s, r * s, 0, 7); }); }
function rain(lt, seed, n, len, wd, a, speed, blur) {
  const R = rng(seed); g.save(); if (blur) g.filter = `blur(${blur}px)`; g.strokeStyle = C.sky; g.lineCap = "round"; g.lineWidth = wd; g.globalAlpha *= a; g.beginPath();
  for (let i = 0; i < n; i++) { const x = R() * (W + 200), y = ((R() * (H + 300) + lt * speed) % (H + 300)) - 150, l = len[0] + R() * (len[1] - len[0]); g.moveTo(x, y); g.lineTo(x - l * 0.12, y + l); }
  g.stroke(); g.restore(); }
function weather(t, P) {
  const lt = t - 5, sky = g.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, C.sea); sky.addColorStop(1, C.pine); g.fillStyle = sky; g.fillRect(-60, -400, W + 120, H + 800);
  rain(lt, 21, 140, [12, 22], 1.5, 0.25, 700, 1.5);
  [[0.55, 60, 300, [mix(C.sea, C.mint, 0.22), mix(C.sea, C.pine, 0.35)], 0.18, 4], [0.85, 140, 220, [mix(C.sea, C.mint, 0.45), C.sea], 0.32, 1.5],
   [1.25, 260, 140, [mix(C.mint, C.cloud, 0.3), mix(C.sea, C.mint, 0.4)], 0.5, 0]].forEach(([s, sp, y0, [top, bot], rim, blur], li) => {
    if (li === 1) rain(lt, 22, 90, [24, 40], 2.2, 0.4, 1100, 0);
    for (let i = 0; i < 5; i++) { const x = ((i * 520 - lt * sp) % 2600 + 2600) % 2600 - 300, y = y0 + (i % 2) * 60 + li * 30;
      g.save(); if (blur) g.filter = `blur(${blur}px)`; cloudPath(x, y, s); const cg = g.createLinearGradient(0, y - 120 * s, 0, y + 100 * s); cg.addColorStop(0, top); cg.addColorStop(1, bot); g.fillStyle = cg; g.fill();
      g.clip(); glow(g, P.x, P.y, 520, C.mint, rim); g.restore(); } });   // rim light from Pip
  // the hero drops: each one shoots past Pip and the counter ticks
  const Rd = rng(41); for (let j = 0; j < NDROPS; j++) { const tc = dropT(j), [bx, by] = spline(tc), x = bx + dropSide(j) * (82 + Rd() * 26), y = by + (t - tc) * 1700;
    if (y < -120 || y > H + 120) continue; g.save(); g.lineCap = "round"; g.strokeStyle = mix(C.sky, C.cloud, 0.35); g.lineWidth = 7; g.beginPath(); g.moveTo(x + 12, y - 120); g.lineTo(x, y); g.stroke();
    g.beginPath(); g.arc(x, y, 9, 0, 7); D.fill(C.cloud); g.restore(); }
  // the splash: a teardrop falls on Pip and bursts into droplets that arc under gravity
  const [ix, iy] = spline(HIT); if (t > HIT - 0.4 && t < HIT + 0.02) { const f = seg(t, HIT - 0.4, HIT, "Launch"), y = lerp(-140, iy - 70, f);
    D.at(ix, y, 1.8, 0, () => { g.beginPath(); g.moveTo(0, -46); g.bezierCurveTo(10, -22, 26, -6, 26, 10); g.arc(0, 10, 26, 0, Math.PI); g.bezierCurveTo(-26, -6, -10, -22, 0, -46);
      const tg = g.createLinearGradient(0, -46, 0, 36); tg.addColorStop(0, mix(C.sky, C.cloud, 0.6)); tg.addColorStop(1, C.sky); g.fillStyle = tg; g.fill();
      g.beginPath(); g.ellipse(-9, 8, 5, 9, 0.3, 0, 7); D.alpha(0.8, () => D.fill(C.cloud)); }); }
  const tau = t - HIT; if (tau > 0 && tau < 1.1) { const R = rng(57), cy = iy - 60;
    D.alpha(1 - clamp(tau / 0.35), () => { g.beginPath(); g.ellipse(ix, cy + 20, 40 + 150 * seg(tau, 0, 0.35, "Land"), 12 + 34 * seg(tau, 0, 0.35, "Land"), 0, 0, 7); g.strokeStyle = mix(C.sky, C.cloud, 0.4); g.lineWidth = 6; g.stroke(); });
    for (let i = 0; i < 18; i++) { const a = -Math.PI / 2 + (R() - 0.5) * 2.7, sp = 360 + R() * 560, r = 4 + R() * 6, vx = Math.cos(a) * sp, vy = Math.sin(a) * sp;
      const x = ix + vx * tau, y = cy + vy * tau + 1300 * tau * tau, dir = Math.atan2(vy + 2600 * tau, vx);
      D.alpha(1 - clamp(tau / 1.1), () => { g.beginPath(); g.ellipse(x, y, r * 1.8, r, dir, 0, 7); D.fill(i % 3 ? C.sky : mix(C.sky, C.cloud, 0.6)); }); } }
  rain(lt, 23, 40, [50, 80], 3.5, 0.55, 1600, 0);
}
function dodged(t) { let n = 0, pop = 0; for (let j = 0; j < NDROPS; j++) if (t >= dropT(j)) { n++; pop = Math.max(pop, Math.exp(-(t - dropT(j)) / 0.09)); } return [n, pop]; }

// ---- world 3 · sunrise: the leaf on its stem lights up from the stem, slow push to the end
function sunrise(t) {
  const lt = t - 10, z = push(t);
  g.save(); g.translate(W / 2, H / 2); g.scale(z, z); g.translate(-W / 2, -H / 2);
  const sky = g.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, C.sea); sky.addColorStop(0.32, mix(C.sea, C.coral, 0.55)); sky.addColorStop(0.62, C.coral); sky.addColorStop(0.9, mix(C.coral, C.cloud, 0.65));
  g.fillStyle = sky; g.fillRect(-200, -500, W + 400, H + 900);
  const sx = W * 0.72, sy = 770;
  for (let i = 0; i < 16; i++) { const a = -Math.PI + (i / 15) * Math.PI + lt * 0.015; g.beginPath(); g.moveTo(sx, sy); g.lineTo(sx + Math.cos(a - 0.03) * 2200, sy + Math.sin(a - 0.03) * 2200); g.lineTo(sx + Math.cos(a + 0.03) * 2200, sy + Math.sin(a + 0.03) * 2200); g.closePath(); D.alpha(0.08, () => D.fill(C.cloud)); }
  glow(g, sx, sy, 700, C.coral, 0.5); glow(g, sx, sy, 400, C.cloud, 0.85);
  g.beginPath(); g.arc(sx, sy, 120, 0, 7); const sg = g.createRadialGradient(sx, sy, 10, sx, sy, 120); sg.addColorStop(0, C.cloud); sg.addColorStop(1, mix(C.coral, C.cloud, 0.5)); g.fillStyle = sg; g.fill();
  const hill = (y, col, d) => { g.beginPath(); g.moveTo(-200, H + 300); for (let x = -200; x <= W + 200; x += 40) g.lineTo(x, y + 60 * Math.sin(x / 300 + d * 3) + 30 * Math.sin(x / 120 + d)); g.lineTo(W + 200, H + 300); D.fill(col); };
  hill(790, mix(C.sea, C.mint, 0.3), 0.3); hill(870, C.sea, 0.6);
  const [tx, ty] = leafTip(), wake = seg(lt, 1.6, 3.8, "Cruise");
  g.beginPath(); g.moveTo(tx - 60, 1000); g.bezierCurveTo(tx - 80, 900, tx - 40, 780, tx, ty); g.strokeStyle = mix(C.sea, C.mint, 0.25); g.lineWidth = 16; g.lineCap = "round"; g.stroke();   // the stem
  hill(950, C.pine, 1);
  glow(g, LEAF.x, LEAF.y, 560, C.spark, 0.22 * wake);
  D.at(LEAF.x, LEAF.y, 1, LEAF.r, () => { g.beginPath(); g.moveTo(-420, 0); g.bezierCurveTo(-200, -300, 260, -260, 420, 0); g.bezierCurveTo(260, 260, -200, 300, -420, 0);
    const lg = g.createLinearGradient(0, -260, 0, 260); lg.addColorStop(0, C.mint); lg.addColorStop(1, C.sea); g.fillStyle = lg; g.fill();
    D.alpha(0.45 * (1 - wake), () => D.fill(C.pine));   // asleep until the light runs through it
    g.save(); g.clip();   // veins stay inside the leaf
    const p = seg(lt, 1.6, 3.6, "Cruise"); g.strokeStyle = C.spark; g.lineCap = "round"; g.lineWidth = 8; g.shadowColor = C.spark; g.shadowBlur = 24; g.beginPath(); g.moveTo(-420, 0); g.lineTo(-420 + 840 * p, 0); g.stroke();
    // side veins follow the leaf's width: long in the middle, short toward the tips, ending inside the edge
    const half = x => 225 * Math.max(0, 1 - (x / 420) ** 2);
    for (let i = 0; i < 6; i++) { const q = seg(lt, 2.0 + i * 0.25, 2.6 + i * 0.25, "Land"), bx = -300 + i * 120, reach = 0.72 * half(bx + 60), run = reach * 0.55;
      g.lineWidth = 5; g.beginPath(); g.moveTo(bx, 0); g.quadraticCurveTo(bx + run * 0.33 * q, -reach * 0.6 * q, bx + run * q, -reach * q); g.moveTo(bx, 0); g.quadraticCurveTo(bx + run * 0.33 * q, reach * 0.6 * q, bx + run * q, reach * q); g.stroke(); }
    g.restore(); g.shadowBlur = 0; });
  // light motes rise off the leaf and fade before they reach the title
  const Rl = rng(31); for (let i = 0; i < 60; i++) { const b = seg(lt, 2.4 + Rl() * 0.8, 5.6, "Cruise"), x = LEAF.x + (Rl() - 0.5) * 760, y = LEAF.y + 60 - b * (160 + Rl() * 260);
    D.alpha(Math.min(1, b * (1 - b) * 4) * clamp((y - 330) / 140), () => { g.beginPath(); g.arc(x, y, 3 + Rl() * 4, 0, 7); D.fill(C.spark); }); }
  g.restore();
}

// ---- transitions: a cloud bank rises through the frame while the camera tilts down; Pip dives through it
function bank(t, a, b, P, pal) {
  const p = seg(t, a, b, "Surge"), Hb = 1500, yt = lerp(H + 100, -Hb - 100, p);
  const cols = pal === 1 ? [mix(C.mint, C.cloud, 0.35), mix(C.sea, C.mint, 0.5), C.sea] : [mix(C.sea, C.mint, 0.4), mix(C.sea, C.mint, 0.12), mix(C.coral, C.cloud, 0.15)];
  [[-80, 0.75, 0.3], [0, 1, 0]].forEach(([off, a2, dark], li) => { const R = rng(70 + pal * 7 + li), y0 = yt + off, y1 = y0 + Hb - off * 2;
    g.beginPath(); g.rect(-60, y0, W + 120, y1 - y0);
